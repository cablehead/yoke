<table id="model-select" style="width: 100%; border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 0.75rem;">
  <thead>
    <tr>
{%- for c in cols %}
  {%- if c.sortable %}
      <th style="text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #ccc; background: #fff; position: sticky; top: 0; cursor: pointer; user-select: none;" data-on:click="$model_sort_click = '{{ c.key }}'; @get('/models')">{{ c.label }}{{ c.arrow }}</th>
  {%- else %}
      <th style="text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #ccc; background: #fff; position: sticky; top: 0;">{{ c.label }}</th>
  {%- endif %}
{%- endfor %}
    </tr>
  </thead>
  <tbody>
{%- for m in rows %}
    <tr class="model-row" data-class="{selected: $model == '{{ m.id }}'}" data-on:click="$model = '{{ m.id }}'">
      <td style="padding: 0.3rem 0.5rem;"><div style="white-space: nowrap;">{{ m.id }}</div><div style="font-size: 0.6875rem; color: #888; white-space: nowrap;">{{ m.name }}</div></td>
      <td style="padding: 0.3rem 0.5rem; text-align: right; white-space: nowrap;">{{ m.intelligence }}</td>
      <td style="padding: 0.3rem 0.5rem; text-align: right; white-space: nowrap;">{{ m.context }}</td>
      <td style="padding: 0.3rem 0.5rem; text-align: right; white-space: nowrap;">{{ m.price_in }}</td>
      <td style="padding: 0.3rem 0.5rem; text-align: right; white-space: nowrap;">{{ m.price_out }}</td>
      <td style="padding: 0.3rem 0.5rem; white-space: nowrap;">{{ m.created }}</td>
    </tr>
{%- endfor %}
  </tbody>
</table>
